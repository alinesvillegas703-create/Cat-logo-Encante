<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>
  Encante — Un toque de magia en cada look
</title>


<style>

/* =========================
   GENERAL
========================= */

*{
  box-sizing:border-box
}

body{
  margin:0;
  color:#29242b;
  background:#fff;
  font-family:Arial,sans-serif
}


/* =========================
   HEADER
========================= */

header{
  min-height:74px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:10px 5%;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  background:#fff;
  z-index:20
}

nav{
  display:flex;
  gap:8px;
  align-items:center
}

nav button{
  border:0;
  background:none;
  font-size:10px;
  letter-spacing:1px;
  cursor:pointer;
  padding:9px
}


/* Instagram */

.instagram{
  color:#29242b;
  text-decoration:none;
  font-size:10px;
  letter-spacing:1px;
  padding:9px;
  white-space:nowrap
}

.instagram:hover{
  opacity:.65
}


/* Carrito */

.cart{
  border:1px solid #ddd!important;
  position:relative
}

#count{
  position:absolute;
  top:-7px;
  right:-7px;
  width:18px;
  height:18px;
  background:#4c2fc5;
  color:#fff;
  border-radius:50%;
  display:grid;
  place-items:center;
  font-size:9px
}


/* =========================
   HERO
========================= */

.hero{
  text-align:center;
  padding:38px 20px 38px
}

.hero-logo{
  width:220px;
  max-width:70%;
  height:auto;
  display:block;
  margin:0 auto 12px
}

.hero p{
  margin:0;
  color:#777;
  font-size:12px
}


/* =========================
   MAIN
========================= */

main{
  max-width:1220px;
  margin:auto;
  padding:0 5% 80px
}

section{
  padding-top:20px;
  margin-bottom:55px
}

h2{
  font:400 31px Georgia,serif;
  margin:0 0 22px
}


/* =========================
   PRODUCT GRID
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:25px
}

.card{
  min-width:0;
  cursor:pointer
}

.card img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  background:#f6f4f7;
  display:block
}

.card-img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  background:#f6f4f7;
  display:block
}

.card:hover .card-img{
  opacity:.94
}


/* =========================
   PRODUCT DETAILS
========================= */

.details{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding-top:11px
}

h3{
  font-size:12px;
  font-weight:500;
  margin:0 0 5px
}

.details p{
  font-size:10px;
  color:#777;
  margin:0 0 4px
}

.details strong{
  font-size:12px;
  white-space:nowrap
}


/* =========================
   AVAILABILITY
========================= */

.status{
  display:inline-block;
  margin-top:8px;
  font-size:8px;
  letter-spacing:1px;
  color:#438354
}

.status.sold{
  color:#999
}


/* =========================
   BUTTONS
========================= */

.actions{
  display:flex;
  gap:6px;
  margin-top:9px
}

.actions button{
  flex:1;
  border:1px solid #4c2fc5;
  background:#4c2fc5;
  color:#fff;
  padding:9px 5px;
  font-size:8px;
  letter-spacing:.7px;
  text-transform:uppercase;
  cursor:pointer
}

.actions .wa{
  background:#fff;
  color:#4c2fc5
}

.actions button:disabled{
  background:#eee;
  color:#999;
  border-color:#eee;
  cursor:not-allowed
}

.empty{
  color:#999;
  font-size:11px
}


/* =========================
   PRODUCT MODAL
========================= */

.product-modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px
}

.product-modal.open{
  display:flex
}

.product-box{
  position:relative;
  width:min(900px,96vw);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  display:grid;
  grid-template-columns:1.1fr .9fr
}

.product-image-wrap{
  background:#f6f4f7;
  min-height:500px;
  display:flex;
  align-items:center;
  justify-content:center
}

.product-image{
  width:100%;
  height:100%;
  max-height:75vh;
  object-fit:contain;
  display:block
}

.product-info{
  padding:42px 35px;
  display:flex;
  flex-direction:column;
  justify-content:center
}

.product-info h2{
  font:400 30px Georgia,serif;
  margin:0 0 10px
}

.product-type{
  color:#777;
  font-size:11px;
  margin:0 0 8px
}

.product-colors{
  color:#777;
  font-size:11px;
  line-height:1.6;
  margin:0 0 20px
}

.product-price{
  font-size:20px;
  margin-bottom:10px
}

.product-status{
  font-size:9px;
  letter-spacing:1px;
  color:#438354;
  margin-bottom:25px
}

.product-status.sold{
  color:#999
}

.product-actions{
  display:flex;
  flex-direction:column;
  gap:8px
}

.product-actions button{
  width:100%;
  padding:13px;
  border:1px solid #4c2fc5;
  background:#4c2fc5;
  color:#fff;
  font-size:9px;
  letter-spacing:1px;
  text-transform:uppercase;
  cursor:pointer
}

.product-actions .wa{
  background:#fff;
  color:#4c2fc5
}

.product-actions button:disabled{
  background:#eee;
  border-color:#eee;
  color:#999;
  cursor:not-allowed
}

.close-modal{
  position:absolute;
  top:12px;
  right:15px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 10px #0002;
  font-size:22px;
  cursor:pointer;
  z-index:5
}


/* =========================
   CART DRAWER
========================= */

.drawer{
  position:fixed;
  right:0;
  top:0;
  height:100%;
  width:min(420px,92vw);
  background:#fff;
  z-index:150;
  box-shadow:-10px 0 30px #0002;
  transform:translateX(100%);
  transition:.25s;
  padding:25px;
  display:flex;
  flex-direction:column
}

.drawer.open{
  transform:translateX(0)
}

.drawer-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #eee;
  padding-bottom:15px
}

.drawer-head h3{
  font:400 26px Georgia,serif;
  margin:0
}

.drawer-head button{
  border:0;
  background:none;
  font-size:22px;
  cursor:pointer
}

#items{
  overflow:auto;
  flex:1
}


/* Cart items */

.item{
  display:grid;
  grid-template-columns:58px 1fr auto;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #eee;
  align-items:center
}

.item img{
  width:58px;
  height:72px;
  object-fit:cover
}

.item strong{
  font-size:11px
}

.item small{
  display:block;
  color:#777;
  margin-top:4px;
  font-size:9px
}

.item button{
  border:0;
  background:none;
  color:#888;
  font-size:9px;
  cursor:pointer
}


/* Total */

.total{
  display:flex;
  justify-content:space-between;
  padding-top:15px;
  border-top:1px solid #ddd;
  font-size:12px
}


/* Checkout */

.checkout{
  margin-top:12px;
  padding:14px;
  border:0;
  background:#4c2fc5;
  color:#fff;
  text-transform:uppercase;
  font-size:9px;
  letter-spacing:1px;
  cursor:pointer
}


/* =========================
   TABLET
========================= */

@media(max-width:900px){

  .grid{
    grid-template-columns:repeat(2,1fr)
  }

  .product-box{
    grid-template-columns:1fr;
    max-width:520px
  }

  .product-image-wrap{
    min-height:360px;
    max-height:52vh
  }

  .product-image{
    max-height:52vh
  }

  .product-info{
    padding:25px
  }

}


/* =========================
   MOBILE
========================= */

@media(max-width:520px){

  header{
    padding:8px 4%;
    min-height:68px
  }

  nav{
    gap:1px
  }

  nav button,
  .instagram{
    font-size:8px;
    padding:7px 5px
  }

  .hero{
    padding:30px 20px 28px
  }

  .hero-logo{
    width:190px;
    max-width:75%
  }

  .grid{
    gap:15px
  }

  h2{
    font-size:28px
  }

  .product-modal{
    padding:10px
  }

  .product-box{
    width:96vw;
    max-height:94vh
  }

  .product-image-wrap{
    min-height:300px;
    max-height:45vh
  }

  .product-info{
    padding:22px
  }

  .product-info h2{
    font-size:25px
  }

}


/* =========================
   PREVENIR SCROLL
========================= */

body.modal-open{
  overflow:hidden
}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

  <nav>

    <button
      onclick="document.getElementById('ropa').scrollIntoView({behavior:'smooth'})"
    >
      Ropa
    </button>

    <button
      onclick="document.getElementById('accesorios').scrollIntoView({behavior:'smooth'})"
    >
      Accesorios
    </button>

    <a
      class="instagram"
      href="https://www.instagram.com/encante.ve/"
      target="_blank"
      rel="noopener"
    >
      @encante.ve
    </a>

    <button
      class="cart"
      onclick="toggleCart()"
    >

      🛒

      <span id="count">
        0
      </span>

    </button>

  </nav>

</header>



<!-- =========================
     HERO
========================= -->

<div class="hero">

  <img
    class="hero-logo"
    src="logo.webp"
    alt="Encante"
    onerror="this.style.display='none'"
  >

  <p>
    Un toque de magia en cada look
  </p>

</div>



<!-- =========================
     PRODUCTS
========================= -->

<main>


  <!-- ROPA -->

  <section id="ropa">

    <h2>
      Ropa
    </h2>

    <div
      class="grid"
      id="ropaGrid"
    >

      <p class="empty">
        Cargando catálogo...
      </p>

    </div>

  </section>



  <!-- ACCESORIOS -->

  <section id="accesorios">

    <h2>
      Accesorios
    </h2>

    <div
      class="grid"
      id="accGrid"
    >

      <p class="empty">
        Cargando catálogo...
      </p>

    </div>

  </section>


</main>



<!-- =========================
     PRODUCT MODAL
========================= -->

<div
  id="productModal"
  class="product-modal"
  onclick="closeProductOutside(event)"
>

  <div
    class="product-box"
    onclick="event.stopPropagation()"
  >

    <button
      class="close-modal"
      onclick="closeProduct()"
    >
      ×
    </button>


    <div class="product-image-wrap">

      <img
        id="modalImage"
        class="product-image"
        src=""
        alt=""
      >

    </div>


    <div class="product-info">

      <h2 id="modalName">
        Producto
      </h2>


      <p
        id="modalType"
        class="product-type"
      ></p>


      <p
        id="modalColors"
        class="product-colors"
      ></p>


      <strong
        id="modalPrice"
        class="product-price"
      >
        $0
      </strong>


      <div
        id="modalStatus"
        class="product-status"
      >
        DISPONIBLE
      </div>


      <div class="product-actions">

        <button
          id="modalCartButton"
          onclick="addModalToCart()"
        >
          Agregar al carrito
        </button>


        <button
          id="modalWAButton"
          class="wa"
          onclick="buyModalWA()"
        >
          WhatsApp
        </button>

      </div>

    </div>

  </div>

</div>



<!-- =========================
     CART
========================= -->

<aside
  id="drawer"
  class="drawer"
>

  <div class="drawer-head">

    <h3>
      Tu carrito
    </h3>

    <button
      onclick="toggleCart()"
    >
      ×
    </button>

  </div>


  <div id="items"></div>


  <div class="total">

    <span>
      Total
    </span>

    <strong id="total">
      $0
    </strong>

  </div>


  <button
    class="checkout"
    onclick="checkout()"
  >
    Comprar por WhatsApp
  </button>

</aside>



<script>


/* =========================
   CONFIGURACIÓN
========================= */

const WA="584141323438";


let products={
  ropa:[],
  accesorios:[]
};


let cart=[];


/* Producto actualmente abierto */

let selectedProduct=null;



/* =========================
   CARGAR PRODUCTOS
========================= */

async function loadProducts(){

  try{

    const r=await fetch(
      "/api/products",
      {cache:"no-store"}
    );

    if(!r.ok){

      throw new Error(
        "No se pudo consultar Airtable"
      );

    }

    products=await r.json();

    renderProducts();

  }catch(e){

    document.getElementById(
      "ropaGrid"
    ).innerHTML=
      '<p class="empty">No se pudo cargar el catálogo.</p>';

    document.getElementById(
      "accGrid"
    ).innerHTML=
      '<p class="empty">No se pudo cargar el catálogo.</p>';

    console.error(e);

  }

}



/* =========================
   MOSTRAR PRODUCTOS
========================= */

function renderProducts(){

  renderGrid(
    "ropaGrid",
    products.ropa || []
  );

  renderGrid(
    "accGrid",
    products.accesorios || []
  );

}



/* =========================
   CREAR TARJETAS
========================= */

function renderGrid(id,arr){

  const grid=document.getElementById(id);

  if(!arr.length){

    grid.innerHTML=
      '<p class="empty">No hay productos disponibles.</p>';

    return;

  }


  grid.innerHTML=arr.map(p=>`

    <article
      class="card"

      data-name="${escapeHtml(p.name)}"

      data-type="${escapeHtml(p.type||"")}"

      data-meta="${escapeHtml(
        Array.isArray(p.colors)
          ? p.colors.join(", ")
          : p.colors || ""
      )}"

      data-price="${Number(p.price)||0}"

      data-stock="${Number(p.stock)||0}"

      data-img="${escapeHtml(p.image||"")}"

      onclick="openProduct(this)"
    >


      ${
        p.image

        ? `<img
            class="card-img"
            src="${escapeHtml(p.image)}"
            alt="${escapeHtml(p.name)}"
            loading="lazy"
            onerror="this.style.display='none'"
          >`

        : `<div class="card-img"></div>`
      }



      <div class="details">

        <div>

          <h3>
            ${escapeHtml(p.name)}
          </h3>


          ${
            p.type
              ? `<p>${escapeHtml(p.type)}</p>`
              : ""
          }


          ${
            Array.isArray(p.colors) && p.colors.length
              ? `<p>Colores: ${escapeHtml(p.colors.join(", "))}</p>`
              : ""
          }

        </div>


        <strong>
          $${formatPrice(p.price)}
        </strong>

      </div>



      <div
        class="status ${p.stock>0?"":"sold"}"
      >

        ${
          p.stock>0
            ? "DISPONIBLE"
            : "AGOTADO"
        }

      </div>



      <div class="actions">

        <button
          ${p.stock>0?"":"disabled"}
          onclick="event.stopPropagation(); addToCart(this)"
        >

          ${
            p.stock>0
              ? "Agregar al carrito
